name: 企业服务订阅申请
description: |
      smart-servlet 自 v3.4 起采用 Apache-2.0，企业可免费商用，**无需采购使用授权**。

      本模板仅用于申请付费的**企业服务订阅**：SLA 响应保障、生产故障兜底、指定版本长期维护、合规材料配合、迁移实施与培训等。

      仅咨询报价或服务范围，请使用[企业服务咨询](https://gitee.com/smartboot-x/smart-servlet/issues/new?template=license_inquiry.yml)模板；已签约客户报障请使用[企业技术支持](https://gitee.com/smartboot-x/smart-servlet/issues/new?template=enterprise_support.yml)模板。
title: "[企业服务订阅申请]: xxx有限公司"
labels: ["service", "subscribe"]
body:
  - type: markdown
    attributes:
      value: |
        ## 申请前请确认
        - 软件本身免费，订阅的是服务与责任保障，不改变 Apache-2.0 授权。
        - smart-servlet 未进入信创目录，核心技术自主研发，可配合代码审计与合规材料。
        - 服务范围、SLA 指标与报价以双方签署的合同为准。
  - type: input
    id: company_name
    attributes:
      label: 企业名称
      description: 请输入完整的企业名称
      placeholder: 例如：某某科技有限公司
    validations:
      required: true
  - type: input
    id: unified_social_credit_code
    attributes:
      label: 统一社会信用代码
      description: 用于合同与开票主体核验
      placeholder: 例如：912345678901234567
    validations:
      required: true
  - type: dropdown
    id: deployment_scale
    attributes:
      label: 部署规模
      options:
        - 1-5 个应用/实例（POC 或试点）
        - 6-20 个应用/实例
        - 21-100 个应用/实例
        - 100 个以上，或多数据中心
    validations:
      required: true
  - type: dropdown
    id: sla_level
    attributes:
      label: 期望的支持等级
      options:
        - 工作日响应 + 远程支持
        - 7x12 响应 + 远程支持
        - 7x24 响应 + 故障兜底（含现场支持）
        - 尚未确定，希望协助评估
    validations:
      required: true
  - type: checkboxes
    id: service_scope
    attributes:
      label: 关注的服务内容（可多选）
      options:
        - label: 专属支持通道与 SLA
        - label: 生产故障处置与兜底
        - label: 指定版本长期维护（LTS）与安全补丁
        - label: JDK / Spring Boot 大版本升级适配
        - label: 信创、代码审计、SBOM、等保等合规材料配合
        - label: 迁移实施、架构评审、压测调优或培训
        - label: 兼容性认证与生态合作
  - type: textarea
    id: scenario
    attributes:
      label: 业务场景与当前状态
      description: 简述使用版本、运行环境、上线计划及当前遇到的主要风险
      placeholder: |
        例如：金融核心系统，当前 v3.3，计划 Q1 上线，需要 7x24 故障兜底与信创材料配合。
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 邮箱、电话或微信，便于发送方案与报价
      placeholder: 例如：email@example.com
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: 申请确认
      options:
        - label: 我承诺提供的企业信息真实有效
          required: true
        - label: 我已知悉 smart-servlet 采用 Apache-2.0 可免费商用，本次申请的是付费服务而非使用授权
          required: true
  - type: markdown
    attributes:
      value: |
        - 提交后可添加个人微信号：`junweiis008`（备注：smart-servlet 服务订阅申请已提交）

          <img src="https://gitee.com/smartboot-x/smart-servlet/raw/master/pages/public/wx.png" width="25%"/>
