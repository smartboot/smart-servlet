name: 开源生态支持
description: 面向所有免费用户的 Bug 反馈、使用咨询与改进建议，由社区提供尽力而为的开源生态支持（无 SLA 承诺）。签约客户请使用合同约定的 1 对 1 专属服务支持。
title:
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## 提交前请了解

        - 公开 Issue **仅提供开源生态支持**：面向所有免费用户，社区尽力而为，**不承诺响应时效，不提供 SLA、故障兜底与赔偿**。
        - 请勿在此提交生产环境故障、密钥口令、内网拓扑、业务数据等敏感信息。
        - **已签约企业服务订阅的客户**：请使用合同约定的 **1 对 1 专属服务支持**（专属对接人 / 专属沟通群 / 服务工单）。公开 Issue 不受理签约客户的报障与 SLA 诉求。
        - 咨询 SLA、报价、订阅申请，或已签约客户需要技术支持，请通过邮箱 `zhengjunweimail@163.com` 1 对 1 联系；公开 Issue 不受理商务与报障。
  - type: dropdown
    id: version
    attributes:
      label: 版本号
      description: 请选择项目使用的 smart-servlet 版本？
      options:
        - v4.0 (最新)
        - 其他版本 / 本地构建
    validations:
      required: true
  - type: dropdown
    id: jdk_version
    attributes:
      label: SDK Version
      description: 请选择项目使用的 Java 版本？
      options:
        - JDK 17
        - JDK 21
        - JDK 22
        - JDK 23
        - JDK 24
        - JDK 25
        - JDK 26
        - 其他
    validations:
      required: true
  - type: input
    id: project
    attributes:
      label: 项目或仓库地址（可选）
      description: 开源项目欢迎附上地址；闭源项目可不填，仅提供最小复现示例即可
  - type: checkboxes
    attributes:
      label: 这个问题是否已经存在？
      options:
        - label: 我已经搜索过现有的问题 (https://gitee.com/smartboot/smart-servlet/issues)
          required: true
        - label: 我知悉公开 Issue 为社区尽力支持，不含 SLA 承诺；签约客户应走 1 对 1 专属通道
          required: true
  - type: textarea
    attributes:
      label: 如何复现
      description: 请详细告诉我们如何复现你遇到的问题，如涉及代码，可提供一个最小代码示例，并使用反引号```附上它
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期结果
      description: 请告诉我们你预期会发生什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 实际结果
      description: 请告诉我们实际发生了什么。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 异常信息
      description: 如果有异常请把详细异常堆栈粘贴上来。
  - type: textarea
    attributes:
      label: 截图或视频
      description: 如果可以的话，上传任何关于 bug 的截图。
      placeholder: |
        可在此处进行图片粘贴上传。
  - type: input
    id: demo
    attributes:
      label: Demo 地址 | 未提供可能影响问题定位效率
      description: 请提供复现错误的 Demo 下载
      placeholder: https://gitee.com/your_id/your_test_project.git
